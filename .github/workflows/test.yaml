name: test

on:
    push:
        branches:
            - main
        paths:
            - lunchable_primelunch/**
            - pyproject.toml
            - uv.lock
            - .github/workflows/test.yaml
    pull_request:
        paths:
            - lunchable_primelunch/**
            - pyproject.toml
            - uv.lock
            - .github/workflows/test.yaml
    schedule:
        - cron: 0 12 1 * *
jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { name: Python 3.13, python: "3.13", task: test }
                    - { name: Python 3.12, python: "3.12", task: test }
                    - {
                          name: Python 3.12 (pandas 3),
                          python: "3.12",
                          task: test:pandas-3,
                      }
                    - { name: Python 3.11, python: "3.11", task: test }
                    - { name: Python 3.10, python: "3.10", task: test }
                    - { name: Python 3.9, python: "3.9", task: test }
        permissions:
            contents: read
            id-token: write
            pull-requests: write
        steps:
            - name: install-locales
              run: |
                  sudo apt-get update
                  sudo apt-get install -y locales
                  sudo locale-gen en_US.UTF-8
                  sudo locale-gen de_DE.UTF-8
                  sudo locale-gen en_GB.UTF-8
                  sudo locale-gen ru_RU.UTF-8
                  sudo update-locale
            - name: test
              uses: juftin/actions/taskfile@v1
              with:
                  checkout: true
                  setup-uv: true
                  task: ${{ matrix.task }}
                  install: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  annotations-pytest: ${{ matrix.python == '3.12' && matrix.task == 'test' && true || false }}
                  pytest-coverage: ${{ matrix.python == '3.12' && matrix.task == 'test' && github.event_name == 'pull_request' && true || false }}
              env:
                  UV_PYTHON: ${{ matrix.python }}
